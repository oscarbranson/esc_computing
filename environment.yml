# Pinned to minor versions so patch releases are picked up but the API
# students see matches the notebooks.
name: esc_computing
channels:
  - conda-forge
dependencies:
  - python=3.14
  - numpy=2.5
  - pandas=3.1
  - matplotlib=3.11
  - scipy=1.18
  - cartopy=0.26
  # Imported directly in Exercise 4; also a cartopy dependency.
  - shapely=2.2
  # Lets VS Code / Jupyter use this environment as a notebook kernel.
  - ipykernel
